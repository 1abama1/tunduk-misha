spring.application.name=auth-service
server.port=8080
debug=false

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG
spring.datasource.url=jdbc:postgresql://localhost:5432/kyrgyzCrm
spring.datasource.username=postgres
# Fail-fast: without env vars the app refuses to start instead of running with publicly known secrets
spring.datasource.password=${POSTGRES_PASSWORD}
jwt.secret=${JWT_SECRET}
app.admin.password=${APP_ADMIN_PASSWORD}
jwt.access.expiration=900000
jwt.refresh.expiration=604800000

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

spring.mvc.async.request-timeout=30000

# === sot.kg integration ===
sotkg.debtor-url=https://portal.sot.kg/ru/debtors
