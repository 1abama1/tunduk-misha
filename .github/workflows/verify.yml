name: Verify backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test real PostgreSQL, and package
        run: bash mvnw -B -ntp clean verify
      - name: Validate Compose template
        run: docker compose config --no-interpolate --quiet
      - name: Build container
        run: docker build -t tunduk-backend:ci .
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports
